name: thread_cpu_placement_timeline
version: "1.0"
type: atomic
category: kernel
tier: B
meta:
  display_name: "任务驻核时间线"
  description: "范围内可定位的系统观测，保留覆盖与缺失；不单凭相关性判断根因"
  icon: "analytics"
  tags: [system, scheduling, evidence, range]
prerequisites:
  modules: [linux.cpu.frequency]
identity:
  policy: verify_if_present
  scope: process
  aliases: [package]
process_scope:
  role: target
  binding: effective_target_processes
sql_fragments:
  - fragments/effective_target_processes.sql
  - fragments/system_sched_spans.sql
inputs:
  - {name: start_ts, type: timestamp, required: true}
  - {name: end_ts, type: timestamp, required: true}
  - {name: package, type: string, required: false}
  - {name: utid, type: number, required: false}
investigation_evidence:
  window: {start: window_start_ts, end: window_end_ts}
  identity: {upid: upid, utid: utid, cpu: cpu, ucpu: ucpu}
  context: {window_id: window_id, role: role}
  metrics:
    - domain: cpu_placement
      metric_id: system.thread.placement.duration
      value: dur_ns
      unit: ns
      status: placement_evidence
display:
  level: detail
  layer: deep
  title: "任务驻核时间线"
  columns:
    - {name: window_id, label: "window_id", type: number, hidden: true}
    - {name: window_start_ts, label: "window_start_ts", type: timestamp, unit: ns, hidden: true}
    - {name: window_end_ts, label: "window_end_ts", type: timestamp, unit: ns, hidden: true}
    - {name: window_dur_ns, label: "window_dur_ns", type: duration, unit: ns, hidden: true}
    - {name: upid, label: "upid", type: number}
    - {name: pid, label: "pid", type: number}
    - {name: process_name, label: "process_name", type: string}
    - {name: utid, label: "utid", type: number}
    - {name: tid, label: "tid", type: number}
    - {name: thread_name, label: "thread_name", type: string}
    - {name: role, label: "role", type: string}
    - {name: sched_id, label: "sched_id", type: number, hidden: true}
    - {name: raw_start_ts, label: "raw_start_ts", type: timestamp, unit: ns, hidden: true}
    - {name: raw_dur, label: "raw_dur", type: duration, unit: ns, hidden: true}
    - {name: raw_end_ts, label: "raw_end_ts", type: timestamp, unit: ns, hidden: true}
    - {name: clipped_start_ts, label: "clipped_start_ts", type: timestamp, unit: ns}
    - {name: clipped_end_ts, label: "clipped_end_ts", type: timestamp, unit: ns}
    - {name: dur_ns, label: "dur_ns", type: duration, unit: ns}
    - {name: is_unfinished, label: "is_unfinished", type: number}
    - {name: left_censored, label: "left_censored", type: number}
    - {name: right_censored, label: "right_censored", type: number}
    - {name: ucpu, label: "ucpu", type: number}
    - {name: cpu, label: "cpu", type: number}
    - {name: machine_id, label: "machine_id", type: number, hidden: true}
    - {name: cluster_id, label: "cluster_id", type: number, hidden: true}
    - {name: capacity, label: "capacity", type: number}
    - {name: core_type, label: "core_type", type: string}
    - {name: topology_source, label: "topology_source", type: string}
    - {name: priority, label: "priority", type: number}
    - {name: end_state, label: "end_state", type: string}
    - {name: scheduling_policy_evidence, label: "scheduling_policy_evidence", type: string}
    - {name: placement_mode, label: "placement_mode", type: string}
    - {name: placement_evidence, label: "placement_evidence", type: string}
    - {name: evidence_scope, label: "evidence_scope", type: string}
sql: |
  WITH system_windows AS (
    SELECT 0 AS window_id, ${start_ts} AS window_start_ts, ${end_ts} AS window_end_ts
  ),
  system_target_threads AS (
    SELECT w.window_id, p.upid, t.utid,
      CASE WHEN t.tid = p.pid THEN 'main' ELSE 'target' END AS role
    FROM system_windows w CROSS JOIN effective_target_processes p
    JOIN thread t ON t.upid = p.upid
    WHERE (${__process_scope.upid} IS NOT NULL OR '${package}' = ''
      OR p.name = '${package}' OR p.name GLOB '${package}:*')
      AND (${utid} IS NULL OR t.utid = ${utid})
  )
  SELECT s.window_id,s.window_start_ts,s.window_end_ts,s.window_end_ts-s.window_start_ts AS window_dur_ns,
    tt.upid,p.pid,p.name AS process_name,tt.utid,t.tid,t.name AS thread_name,tt.role,
    s.sched_id,s.raw_start_ts,s.raw_dur,s.raw_end_ts,s.clipped_start_ts,s.clipped_end_ts,s.dur_ns,
    s.is_unfinished,s.left_censored,s.right_censored,s.ucpu,s.cpu,s.machine_id,s.cluster_id,s.capacity,
    s.core_type,s.topology_source,s.priority,s.end_state,
    'not_recorded_in_sched_slice' AS scheduling_policy_evidence,
    CASE WHEN s.topology_source='capacity_uniform_no_big_little' THEN 'homogeneous_big_little_not_applicable'
      WHEN s.core_type='unknown' THEN 'unknown_topology' ELSE 'heterogeneous_capacity' END AS placement_mode,
    CASE WHEN s.topology_source='capacity_uniform_no_big_little' THEN 'observed'
      WHEN s.core_type='unknown' THEN 'partial' ELSE 'observed' END AS placement_evidence,
    'placement_observation_not_affinity_configuration' AS evidence_scope
  FROM system_sched_spans s JOIN system_target_threads tt
    ON tt.window_id=s.window_id AND tt.utid=s.utid AND tt.upid=s.upid
  JOIN thread t ON tt.utid=t.utid JOIN process p ON p.upid=tt.upid
  ORDER BY s.window_id,s.raw_start_ts,s.sched_id
output:
  format: structured
